<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Personal Archive — Digital Memory Map</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; background: var(--bg-base);">
    <div style="width: 100%; max-width: 480px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" class="nav-brand" style="justify-content: center; font-size: 1.6rem; margin-bottom: 0.5rem;">
                <span class="brand-icon">DM</span>
                <div>
                    <div>DIGITAL MEMORY MAP</div>
                    <span class="brand-sub">NEW ARCHIVIST REGISTRY</span>
                </div>
            </a>
            <p class="mono-text" style="color: var(--text-muted); font-size: 0.82rem; margin-top: 0.4rem;">
                OPEN PERSONAL GEOGRAPHIC ARCHIVE // VOL. 2026
            </p>
        </div>

        <div class="card" style="box-shadow: var(--shadow-md);">
            <div id="register-alert" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.85rem; font-family:'Space Mono',monospace; background: #fee2e2; border: 1.5px solid var(--danger); color: var(--danger);"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullname" class="form-label">ARCHIVIST FULL NAME</label>
                    <input type="text" id="fullname" class="form-control" placeholder="e.g. Robert Fox" required minlength="2" maxlength="100">
                    <span id="fullname-error" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">EMAIL ADDRESS</label>
                    <input type="email" id="email" class="form-control" placeholder="archivist@domain.com" required maxlength="150" autocomplete="email">
                    <span id="email-error" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">ACCESS PASSWORD</label>
                    <input type="password" id="password" class="form-control" placeholder="Min. 8 chars (upper, lower, digit)" required minlength="8" maxlength="64" autocomplete="new-password">
                    <span id="password-error" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Repeat access password" required minlength="8" maxlength="64" autocomplete="new-password">
                    <span id="confirm-password-error" class="form-error"></span>
                </div>

                <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
                    INITIALIZE ARCHIVE &rarr;
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-secondary); border-top: 1px solid var(--border-dark); padding-top: 1rem;">
                Already registered? <a href="login.html" style="font-weight: 700; text-decoration: underline;">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (Auth.isLoggedIn()) {
                window.location.href = Auth.url('dashboard.html');
                return;
            }

            const form = document.getElementById('register-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const fullName = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const submitBtn = document.getElementById('register-submit-btn');

                // Client-side validation checks
                if (password !== confirmPassword) {
                    showFieldError('confirm-password', 'Passwords do not match.');
                    return;
                }

                if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                    showFieldError('password', 'Password must include at least one uppercase letter, one lowercase letter, and one digit.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'INITIALIZING ARCHIVE...';

                try {
                    const data = await API.post('/api/auth/register', {
                        fullName,
                        email,
                        password,
                        confirmPassword
                    });

                    Auth.setUser(data);
                    Toast.success('Account created successfully!');
                    setTimeout(() => {
                        window.location.href = Auth.url('dashboard.html');
                    }, 400);
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'INITIALIZE ARCHIVE \u2192';

                    if (err.errors) {
                        for (const [field, messages] of Object.entries(err.errors)) {
                            const inputId = field.toLowerCase().replace('password', 'password');
                            showFieldError(inputId, messages[0]);
                        }
                    } else {
                        showAlert(err.message || 'Registration failed.');
                    }
                }
            });

            function showFieldError(fieldId, msg) {
                const errorSpan = document.getElementById(`${fieldId}-error`);
                if (errorSpan) {
                    errorSpan.textContent = msg;
                    errorSpan.classList.add('visible');
                } else {
                    showAlert(msg);
                }
            }

            function clearErrors() {
                document.querySelectorAll('.form-error').forEach(el => {
                    el.textContent = '';
                    el.classList.remove('visible');
                });
                const alert = document.getElementById('register-alert');
                alert.style.display = 'none';
            }

            function showAlert(msg) {
                const alert = document.getElementById('register-alert');
                alert.textContent = msg;
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
